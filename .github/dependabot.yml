# Cargo: version updates off (`forge deps` does those), conventional titles
# for security fixes. GitHub Actions: version updates on, since every repo
# calling the shared workflows runs the actions they pin; this repo is
# public, so their PRs' CI is free. Move v1 after merging one.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"

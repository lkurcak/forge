name: Rust CI

# The checks shared by every Rust repo forge manages. Each repo's ci.yml calls
# it like callers/rust-ci.yml in this repo. Triggers can't be shared, so they
# live there: a caller may leave some out but add no others, which forge
# checks.
#
# Pull requests test the branch merged into main as it was then; the push run
# tests what actually landed, which also covers direct pushes and is what the
# release workflow relies on. The weekly run catches new stable Rust breaking
# a repo nobody touched. A newer run of the same ref cancels an older one.
#
# Rust versions come from the repo, not from here: with `msrv: true`, the
# MSRV job tests Cargo.toml's rust-version, with that toolchain. Writing the
# version as an input (not `dtolnay/rust-toolchain@1.85`) keeps Dependabot
# from bumping it. It's for libraries, whose users build them with their own
# Rust; it doubles the Linux tests, so an application built on recent stable
# is better off without it.
#
# A repo shipping a container image lets the call publish packages:
#
#   jobs:
#     ci:
#       uses: lkurcak/forge/.github/workflows/rust-ci.yml@v1
#       permissions:
#         contents: read
#         packages: write
#       with:
#         container: true
#
# The container jobs take whatever the caller grants, so callers without
# containers don't have to grant packages: write; every other job keeps
# contents: read for itself.
#
# Each push to the default branch publishes the image as latest. When
# Cargo.toml has a version the registry doesn't have yet, that push is the
# release, and the image is tagged X.Y.Z and X.Y too. Tags build nothing:
# a release builds once, on the default branch, whose build cache every
# later run can read (a tag's run can't leave one anyone reads).
#
# Where Actions minutes are billed (private repos), `light: true` keeps CI to
# a sanity check and leaves the rest to the machine the work is done on:
#
#   with:
#     light: true
#     container: true   # if it ships one
#
# Pull requests, the weekly run and manual runs then get one Linux job, `ok`,
# running fmt, clippy and the tests (`tests: false` leaves them out), so the
# setup and the build cache are paid for once. Nothing else runs: no docs,
# packaging, MSRV, macOS, Windows or images. A push runs nothing but the
# image, built and published for linux/amd64 (`arm64: true` adds
# linux/arm64); the pull request already checked what landed. Every job is
# billed at least a minute, and the full set runs up to a dozen per push.
# The weekly run, on the default branch, also leaves a build cache there for
# pull requests to start from; it's the only run that saves one.
#
# Linux jobs run on GitHub's ubuntu-latest, or on the runners the repo's
# FORGE_RUNNER variable names (a runs-on label) where it's set: forge sets it
# on private repos from the manifest's [runner], for runners of your own,
# whose minutes aren't billed. FORGE_BUILDKIT, if set too, is the BuildKit
# those runners build images on, for runners without a Docker daemon.
# macOS, Windows and arm64 jobs stay on GitHub's runners. The build cache
# leaves ~/.cargo/bin out (cache-bin: false): saving it deletes what was there
# when the job started, rustup and cargo included, and a runner of your own
# keeps that for its next job. Nothing here is `cargo install`ed.
#
# A pull request from `forge deps` (branch forge/deps) runs nothing either,
# unless the repo is no-std: it only touches Cargo.lock, and forge ran clippy
# and the tests on it before opening it, which its forge/deps status says.
# This leaves `ci / ok` skipped, which only works without a ruleset
# requiring it, as on private repos without private_protection.
#
# A pull request or push that changes nothing but BACKLOG.md and backlog/
# (the backlog almanac shows, which no check reads) and the paths the
# `untested` input names skips the checks. The `changes` job (with light,
# a step of `ok`) lists the paths it touches, against the pull request's
# base or the push's one parent, and every other job runs unless each of
# them is on that list. `ok` still runs and passes. That's why this isn't
# `paths-ignore` in the caller: a workflow that doesn't start never
# reports `ci / ok`, so the ruleset would keep the pull request waiting.
# What it can't tell runs everything: scheduled and manual runs, a push of
# more than one commit, a rename (its old path counts too), a path git
# quotes, a failure to tell. Images are built as before.
#
# Image layers are cached between runs, so the Dockerfile compiles the
# dependencies in a layer of their own with cargo-chef (forge's `container`
# tag checks for it). That layer only rebuilds when Cargo.toml, Cargo.lock or
# the toolchain changes; a source change only recompiles the crate:
#
#   FROM rust:1-bookworm AS chef
#   RUN cargo install cargo-chef --locked
#   WORKDIR /build
#   # With a rust-toolchain.toml; without one, leave out these two lines.
#   COPY rust-toolchain.toml ./
#   RUN rustup toolchain install
#
#   FROM chef AS planner
#   COPY . .
#   RUN cargo chef prepare --recipe-path recipe.json
#
#   FROM chef AS builder
#   COPY --from=planner /build/recipe.json ./
#   RUN cargo chef cook --locked --release --recipe-path recipe.json
#   COPY Cargo.toml Cargo.lock ./
#   COPY src ./src
#   RUN cargo build --locked --release
#
#   FROM debian:bookworm-slim
#   COPY --from=builder /build/target/release/{binary} /usr/local/bin/
#   ...
#
# The planner copies the whole context, so .dockerignore should leave out
# target and .git. A pinned toolchain (a dated nightly, say) keeps the cache
# warm; `nightly` alone rebuilds everything daily.

on:
  workflow_call:
    inputs:
      bevy:
        description: >-
          The workspace builds Bevy (with --all-features, at least): install
          the system libraries it needs on Linux (BEVY_LINUX_PACKAGES).
        type: boolean
        default: false
      no-std:
        description: >-
          The crate works without std: build it with --no-default-features
          for NO_STD_TARGET, which has no std at all, on stable (and with
          msrv, on the MSRV too).
        type: boolean
        default: false
      msrv:
        description: >-
          Test the workspace with the oldest Rust it supports, the highest
          rust-version among its packages' Cargo.toml, which must set one:
          for libraries, whose users build them with their own Rust.
        type: boolean
        default: false
      container:
        description: >-
          The repo ships as a container image, from the Dockerfile at its
          root: test on Linux only, where it runs, then build the image for
          linux/amd64 and linux/arm64. Pull requests only build it; pushes to
          the default branch publish it to ghcr.io/{owner}/{repo} as latest,
          and as X.Y.Z and X.Y while the registry lacks Cargo.toml's version.
          Tags build no image.
        type: boolean
        default: false
      light:
        description: >-
          Keep CI to a sanity check, for repos whose Actions minutes are
          billed: one Linux job (fmt, clippy, tests) on pull requests
          (but not forge deps' own), scheduled and manual runs, and on
          pushes only the container image, for linux/amd64 alone unless
          arm64 is set. See the header.
        type: boolean
        default: false
      tests:
        description: >-
          With light, run the tests too; a repo tested only where it's
          worked on sets this to false. Without light, tests always run.
        type: boolean
        default: true
      arm64:
        description: >-
          With light and container, build the image for linux/arm64 as well
          as linux/amd64. Without light, images are always built for both.
        type: boolean
        default: false
      untested:
        description: >-
          Paths no check reads, besides BACKLOG.md and backlog/, separated
          by spaces: a file, or a directory ending in /. A pull request or
          push changing only such paths skips the checks, and `ok` passes.
          See the header.
        type: string
        default: ""

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Bare-metal ARM: anything reaching for std, in the crate or its
  # dependencies, fails to build here.
  NO_STD_TARGET: thumbv7em-none-eabi
  # From Bevy's Linux setup guide: audio, input, windowing and GL.
  BEVY_LINUX_PACKAGES: >-
    libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
    libx11-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev
    libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev
  IMAGE: ghcr.io/${{ github.repository }}
  # What the `changes` job runs, and with light, `ok` (see the header).
  # t-ci.yml has the same.
  CHANGES: |
    # Prints checked=false when every path the change touches is untested,
    # and checked=true otherwise: on another event, on a push of more than
    # one commit, on an empty diff, or when it can't tell.
    set -uo pipefail
    list=(BACKLOG.md backlog/)
    set -f
    for p in $UNTESTED; do
      if [[ ! "$p" =~ ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*/?$ ]]; then
        echo "::error::untested: not a path of the repo: $p"
        exit 1
      fi
      list+=("$p")
    done
    set +f
    listed() {
      local p
      for p in "${list[@]}"; do
        case "$p" in
          */) [[ "$1" == "$p"* ]] && return 0 ;;
          *) [[ "$1" == "$p" ]] && return 0 ;;
        esac
      done
      return 1
    }
    only_untested() {
      local base files f
      case "$GITHUB_EVENT_NAME" in
        pull_request) base=HEAD^1 ;;
        push)
          base=$(git rev-parse -q --verify 'HEAD^') || return 1
          [[ "$base" == "$BEFORE" ]] || return 1
          ;;
        *) return 1 ;;
      esac
      files=$(git diff --no-renames --name-only "$base" HEAD) || return 1
      [[ -n "$files" ]] || return 1
      while IFS= read -r f; do
        if ! listed "$f"; then
          echo "Checked: $f"
          return 1
        fi
      done <<<"$files"
    }
    if only_untested; then
      echo "Only untested paths changed, so the checks are skipped"
      echo "checked=false" >>"$GITHUB_OUTPUT"
    else
      echo "checked=true" >>"$GITHUB_OUTPUT"
    fi

jobs:
  # Whether the change touches anything a check reads (see the header).
  changes:
    if: ${{ !inputs.light }}
    permissions:
      contents: read
    runs-on: ${{ vars.FORGE_RUNNER || 'ubuntu-latest' }}
    outputs:
      checked: ${{ steps.changes.outputs.checked }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: changes
        name: Does it change anything checked?
        env:
          UNTESTED: ${{ inputs.untested }}
          BEFORE: ${{ github.event.before }}
        run: bash -c "$CHANGES"

  fmt:
    needs: changes
    if: ${{ !inputs.light && needs.changes.outputs.checked != 'false' }}
    permissions:
      contents: read
    runs-on: ${{ vars.FORGE_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    needs: changes
    if: ${{ !inputs.light && needs.changes.outputs.checked != 'false' }}
    permissions:
      contents: read
    runs-on: ${{ vars.FORGE_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - if: inputs.bevy && runner.os == 'Linux'
        name: Install Bevy's Linux libraries
        run: |
          # shellcheck disable=SC2086 # one argument per package
          sudo apt-get update && sudo apt-get install -y --no-install-recommends $BEVY_LINUX_PACKAGES
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    needs: changes
    if: ${{ !inputs.light && needs.changes.outputs.checked != 'false' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{ fromJSON(format(inputs.container && '["{0}"]'
          || '["{0}", "macos-latest", "windows-latest"]',
          vars.FORGE_RUNNER || 'ubuntu-latest')) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - if: inputs.bevy && runner.os == 'Linux'
        name: Install Bevy's Linux libraries
        run: |
          # shellcheck disable=SC2086 # one argument per package
          sudo apt-get update && sudo apt-get install -y --no-install-recommends $BEVY_LINUX_PACKAGES
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - run: cargo test --workspace --all-features --locked

  doc:
    needs: changes
    if: ${{ !inputs.light && needs.changes.outputs.checked != 'false' }}
    permissions:
      contents: read
    runs-on: ${{ vars.FORGE_RUNNER || 'ubuntu-latest' }}
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - if: inputs.bevy && runner.os == 'Linux'
        name: Install Bevy's Linux libraries
        run: |
          # shellcheck disable=SC2086 # one argument per package
          sudo apt-get update && sudo apt-get install -y --no-install-recommends $BEVY_LINUX_PACKAGES
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - run: cargo doc --workspace --all-features --no-deps --locked

  # What the release would upload to crates.io, for crates that can be
  # published at all.
  package:
    needs: changes
    if: ${{ !inputs.light && needs.changes.outputs.checked != 'false' }}
    permissions:
      contents: read
    runs-on: ${{ vars.FORGE_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Dry-run cargo publish
        run: |
          publishable=$(cargo metadata --no-deps --format-version 1 \
            | jq '[.packages[] | select(.publish != [])] | length')
          if [ "$publishable" -eq 0 ]; then
            echo "Nothing here is published to crates.io"
            exit 0
          fi
          cargo publish --workspace --dry-run --locked

  msrv:
    needs: changes
    if: inputs.msrv && !inputs.light && needs.changes.outputs.checked != 'false'
    permissions:
      contents: read
    runs-on: ${{ vars.FORGE_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version
        id: msrv
        run: |
          msrv=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '[.packages[].rust_version // empty] | sort_by(split(".") | map(tonumber)) | last // empty')
          if [ -z "$msrv" ]; then
            echo "::error::msrv is on, but no Cargo.toml sets rust-version"
            exit 1
          fi
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          targets: ${{ inputs.no-std && env.NO_STD_TARGET || '' }}
      - if: inputs.bevy && runner.os == 'Linux'
        name: Install Bevy's Linux libraries
        run: |
          # shellcheck disable=SC2086 # one argument per package
          sudo apt-get update && sudo apt-get install -y --no-install-recommends $BEVY_LINUX_PACKAGES
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - run: cargo test --workspace --all-features --locked
      - if: inputs.no-std
        run: cargo build --workspace --no-default-features --locked --target "$NO_STD_TARGET"

  no-std:
    permissions:
      contents: read
    needs: changes
    if: inputs.no-std && !inputs.light && needs.changes.outputs.checked != 'false'
    runs-on: ${{ vars.FORGE_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.NO_STD_TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - run: cargo build --workspace --no-default-features --locked --target "$NO_STD_TARGET"

  # One image per architecture, each built natively and pushed by digest
  # alone; container-publish tags them together as one multi-arch image.
  # Built alone (light, without arm64), the image is pushed under its tags
  # right here instead. Light builds images on pushes only. Of pushes, only
  # the default branch's build one. On FORGE_RUNNER, amd64 builds on the
  # BuildKit FORGE_BUILDKIT names, if set (a runner without a Docker
  # daemon), which keeps its own layer cache instead of GitHub's. The build
  # arg GIT_COMMIT is the commit being built, for a Dockerfile that declares
  # it (ARG GIT_COMMIT) to tell the app, so its health check can say what's
  # deployed.
  container:
    if: >-
      ${{ !cancelled() && !failure() && inputs.container
      && (!inputs.light || github.event_name == 'push')
      && (github.event_name != 'push'
      || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    needs: [fmt, clippy, test, doc, package, msrv]
    name: container (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(format(
          '[{{"platform": "linux/amd64", "runner": "{0}", "buildkit": "{1}"}}{2}]',
          vars.FORGE_RUNNER || 'ubuntu-latest', vars.FORGE_BUILDKIT,
          !(inputs.light && !inputs.arm64)
          && ', {"platform": "linux/arm64", "runner": "ubuntu-24.04-arm", "buildkit": ""}'
          || '')) }}
    runs-on: ${{ matrix.runner }}
    env:
      PUSH: ${{ github.event_name == 'push' }}
      ALONE: ${{ inputs.light && !inputs.arm64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
        with:
          driver: ${{ matrix.buildkit && 'remote' || 'docker-container' }}
          endpoint: ${{ matrix.buildkit }}
      - if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A version Cargo.toml has and the registry doesn't is a release. Same
      # rule as rust-release.yml: every crate that gets published shares the
      # version (all of them, if none is published).
      - if: env.PUSH == 'true' && env.ALONE == 'true'
        name: Is this a release?
        id: release
        run: |
          version=$(RUSTUP_TOOLCHAIN=stable cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages as $all
                | [$all[] | select(.publish != [])] | if length > 0 then . else $all end
                | .[0].version')
          if docker buildx imagetools inspect "$IMAGE:$version" > /dev/null 2>&1; then
            echo "$version is published already: tagging latest alone"
          else
            echo "Releasing $version"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi
      - id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}},value=${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.version != '' }}
      - id: arch
        run: echo "arch=${PLATFORM#linux/}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: GIT_COMMIT=${{ github.sha }}
          tags: ${{ env.PUSH == 'true' && env.ALONE == 'true' && steps.metadata.outputs.tags || '' }}
          outputs: >-
            ${{ env.PUSH != 'true' && 'type=cacheonly'
            || env.ALONE == 'true' && 'type=image,push=true'
            || format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) }}
          cache-from: >-
            ${{ !matrix.buildkit
            && format('type=gha,scope=container-{0}', steps.arch.outputs.arch) || '' }}
          cache-to: >-
            ${{ !matrix.buildkit
            && format('type=gha,mode=max,scope=container-{0}', steps.arch.outputs.arch) || '' }}
      - if: env.PUSH == 'true' && env.ALONE != 'true'
        name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - if: env.PUSH == 'true' && env.ALONE != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ steps.arch.outputs.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  container-publish:
    if: >-
      ${{ !cancelled() && needs.container.result == 'success' && inputs.container
      && github.event_name == 'push' && !(inputs.light && !inputs.arm64) }}
    needs: container
    runs-on: ${{ vars.FORGE_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
        with:
          driver: ${{ vars.FORGE_BUILDKIT && 'remote' || 'docker-container' }}
          endpoint: ${{ vars.FORGE_BUILDKIT }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A version Cargo.toml has and the registry doesn't is a release. Same
      # rule as rust-release.yml: every crate that gets published shares the
      # version (all of them, if none is published).
      - name: Is this a release?
        id: release
        run: |
          version=$(RUSTUP_TOOLCHAIN=stable cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages as $all
                | [$all[] | select(.publish != [])] | if length > 0 then . else $all end
                | .[0].version')
          if docker buildx imagetools inspect "$IMAGE:$version" > /dev/null 2>&1; then
            echo "$version is published already: tagging latest alone"
          else
            echo "Releasing $version"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi
      - id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}},value=${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.version != '' }}
      - name: Tag the images as one
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          args=()
          while read -r tag; do
            [ -n "$tag" ] && args+=(--tag "$tag")
          done <<<"$TAGS"
          for digest in *; do
            args+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${args[@]}"

  # One check that passes only if every job above passed or was skipped:
  # what a ruleset requires (require-ci, "ci / ok"), so a PR's auto-merge
  # waits for all of CI, whichever jobs a repo's inputs turn on. With light,
  # it's the one job, and does the checking itself, except on forge deps'
  # pull requests (head_ref is empty outside pull requests).
  ok:
    if: >-
      ${{ !inputs.light && always()
      || inputs.light && !cancelled() && github.event_name != 'push'
      && (github.head_ref != 'forge/deps' || inputs.no-std) }}
    needs: [changes, fmt, clippy, test, doc, package, msrv, no-std, container, container-publish]
    permissions:
      contents: read
    runs-on: ${{ vars.FORGE_RUNNER || 'ubuntu-latest' }}
    steps:
      - if: ${{ !inputs.light }}
        name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
      - if: inputs.light
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - if: inputs.light
        id: changes
        name: Does it change anything checked?
        env:
          UNTESTED: ${{ inputs.untested }}
          BEFORE: ${{ github.event.before }}
        run: bash -c "$CHANGES"
      - if: inputs.light && steps.changes.outputs.checked != 'false'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ inputs.no-std && env.NO_STD_TARGET || '' }}
      - if: inputs.light && inputs.bevy && steps.changes.outputs.checked != 'false'
        name: Install Bevy's Linux libraries
        run: |
          # shellcheck disable=SC2086 # one argument per package
          sudo apt-get update && sudo apt-get install -y --no-install-recommends $BEVY_LINUX_PACKAGES
      - if: inputs.light && steps.changes.outputs.checked != 'false'
        run: cargo fmt --all --check
      # Pull requests start from the default branch's cache, and a pull
      # request's own is rarely read again (most get one run), so light
      # saves it from the weekly and manual runs alone: quicker pull
      # requests, and their caches don't crowd the image layers out of the
      # repo's 10 GB.
      - if: inputs.light && steps.changes.outputs.checked != 'false'
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          save-if: ${{ github.event_name != 'pull_request' }}
      - if: inputs.light && steps.changes.outputs.checked != 'false'
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - if: inputs.light && inputs.tests && steps.changes.outputs.checked != 'false'
        run: cargo test --workspace --all-features --locked
      - if: inputs.light && inputs.no-std && steps.changes.outputs.checked != 'false'
        run: cargo build --workspace --no-default-features --locked --target "$NO_STD_TARGET"

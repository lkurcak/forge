name: T CI

# The checks shared by every repo written in T (https://github.com/lkurcak/t-lang).
# Each repo calls it from its t.yml like callers/t-ci.yml in this repo.
# Triggers can't be shared, so they live there: a caller may leave some out
# but add no others, which forge checks.
#
# The repo pins the `t` it's checked with, by version and by the sha256 of
# the release archive, so a release whose archive changed fails here instead
# of running something else. Then it runs `run`, the repo's own script, which
# says what checking it means: typically `t check --deny-warnings`, `t fmt
# --check`, `t test`, and the program's output against what's expected.
#
# A pull request or push that changes nothing but BACKLOG.md, backlog/,
# CLAUDE.md, PROJECT.md and the paths the `untested` input names skips
# those steps, and `ok` passes, as in rust-ci.yml (see its header).

on:
  workflow_call:
    inputs:
      t-version:
        description: The t-lang release to check with, like v0.65.0.
        type: string
        required: true
      t-sha256:
        description: >-
          The sha256 of that release's x86_64-unknown-linux-gnu archive, from
          its asset digest.
        type: string
        required: true
      run:
        description: The command that checks the repo, run from its root.
        type: string
        default: tests/run.sh
      untested:
        description: >-
          Paths no check reads, besides BACKLOG.md, backlog/, CLAUDE.md and
          PROJECT.md, separated by spaces: a file, or a directory ending in
          /. A pull request or push changing only such paths skips the
          checks, and `ok` passes.
        type: string
        default: ""

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Named `ok`, so it's the check a ruleset requires (require-ci, "ci / ok"),
  # as for Rust repos, and a PR's auto-merge waits for it. rust-ci needs a
  # job of that name to sum up its others; with a single job, it's that job.
  ok:
    permissions:
      contents: read
    runs-on: ${{ vars.FORGE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: changes
        name: Does it change anything checked?
        env:
          UNTESTED: ${{ inputs.untested }}
          BEFORE: ${{ github.event.before }}
        run: |
          # Prints checked=false when every path the change touches is
          # untested, and checked=true otherwise: on another event, on a push
          # of more than one commit, on an empty diff, or when it can't tell.
          # Not -e: a failure to tell is checked=true. The same in rust-ci.yml
          # (twice) and t-ci.yml, which a test of forge's checks.
          set +e -uo pipefail
          list=(BACKLOG.md backlog/ CLAUDE.md PROJECT.md)
          set -f
          for p in $UNTESTED; do
            if [[ ! "$p" =~ ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*/?$ ]]; then
              echo "::error::untested: not a path of the repo: $p"
              exit 1
            fi
            list+=("$p")
          done
          set +f
          listed() {
            local p
            for p in "${list[@]}"; do
              case "$p" in
                */) [[ "$1" == "$p"* ]] && return 0 ;;
                *) [[ "$1" == "$p" ]] && return 0 ;;
              esac
            done
            return 1
          }
          only_untested() {
            local base files f
            case "$GITHUB_EVENT_NAME" in
              pull_request) base=HEAD^1 ;;
              push)
                base=$(git rev-parse -q --verify 'HEAD^') || return 1
                [[ "$base" == "$BEFORE" ]] || return 1
                ;;
              *) return 1 ;;
            esac
            files=$(git diff --no-renames --name-only "$base" HEAD) || return 1
            [[ -n "$files" ]] || return 1
            while IFS= read -r f; do
              if ! listed "$f"; then
                echo "Checked: $f"
                return 1
              fi
            done <<<"$files"
          }
          if only_untested; then
            echo "Only untested paths changed, so the checks are skipped"
            echo "checked=false" >>"$GITHUB_OUTPUT"
          else
            echo "checked=true" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.checked != 'false'
        name: Install t
        env:
          T_VERSION: ${{ inputs.t-version }}
          T_SHA256: ${{ inputs.t-sha256 }}
        run: |
          # The inputs are data, never shell code: check their shape first.
          [[ "$T_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "t-version: not vX.Y.Z: $T_VERSION"; exit 1; }
          [[ "$T_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "t-sha256: not 64 lowercase hex digits"; exit 1; }
          name="t-lang-${T_VERSION}-x86_64-unknown-linux-gnu"
          curl -fsSL -o t.tar.gz \
            "https://github.com/lkurcak/t-lang/releases/download/${T_VERSION}/${name}.tar.gz"
          echo "${T_SHA256}  t.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar xzf t.tar.gz
          mv "${name}/t" "$HOME/.local/bin/t"
          rm -r t.tar.gz "${name}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - if: steps.changes.outputs.checked != 'false'
        run: t --version
      - if: steps.changes.outputs.checked != 'false'
        name: Check
        env:
          RUN: ${{ inputs.run }}
        run: bash -c "$RUN"

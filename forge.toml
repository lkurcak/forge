[repos.entropy-lab]
tags = ["rust"]

[repos.home-server]
tags = ["rust"]

[repos.sound]
tags = ["rust"]

[repos.magicube-solver]
tags = ["rust"]

[repos.arena-game]
tags = ["rust"]


# Repositories forge manages, and what they should look like.
#
# Top-level `settings`, `actions` and `rulesets` apply to every repo; a repo's
# own table overrides them (`settings`/`actions` key by key, `rulesets` wholesale).
# A repo's `tags` add the requirements listed under `[tags.<name>]`; tags
# without a table are just labels.

owner = "lkurcak"

# The latest GitHub release of every repo must be tagged vX.Y.Z. Repos without
# releases are left alone; older bare X.Y.Z tags only matter while they're the
# latest release.
release_tag_prefix = "v"

# Workflows Rust repos share, keyed by the file in .github/workflows/ a repo
# calls them from. A repo opts in by making that file a call, and configures
# the workflow through its inputs, e.g. what a release ships:
#
#   jobs:
#     release:
#       uses: lkurcak/forge/.github/workflows/rust-release.yml@v1
#       permissions:
#         contents: write
#         id-token: write
#       secrets: inherit
#       with:
#         crates-io: true
#         binaries: true
#
# forge reads those calls. The repo gets a tag named after each workflow it
# calls (`rust-release`, `rust-ci`), plus a tag per input set to true, so the
# tables below apply to it as if it were tagged in this file. Calls must use
# the ref given here; `v1` moves along with compatible changes.
#
# Releases are then checked to have the archives the workflow builds
# ({repo}-vX.Y.Z-{target}.tar.gz, .zip on Windows; the targets are the release
# workflow's {INPUT}_TARGETS lists), and to have reached the package managers:
# crates.io's newest version, Formula/{repo}.rb in homebrew-tap, and
# {owner}.{repo} in winget-pkgs. A PR still delivering a release shows as
# pending.
[workflows]
"release.yml" = "lkurcak/forge/.github/workflows/rust-release.yml@v1"
"ci.yml" = "lkurcak/forge/.github/workflows/rust-ci.yml@v1"

# Rulesets are opt-in per repo: `rulesets = [...]` names files in rulesets/,
# without the .json extension.
#   protect-default-branch  no deleting or force-pushing the default branch
#   require-pr              changes to the default branch must go through a PR
# Private repos are skipped: rulesets there need GitHub Pro.

# PATCH /repos/{owner}/{repo}
# Disabling merge commits and rebase merging is what makes PRs squash-only.
[settings]
allow_squash_merge = true
allow_merge_commit = false
allow_rebase_merge = false
squash_merge_commit_title = "PR_TITLE"
squash_merge_commit_message = "PR_BODY"
delete_branch_on_merge = true
allow_update_branch = true
# Nothing has required checks for auto-merge to wait on.
allow_auto_merge = false

# PUT /repos/{owner}/{repo}/actions/permissions/workflow
[actions]
default_workflow_permissions = "read"
# Nothing needs workflows to open PRs yet (release-plz would).
can_approve_pull_request_reviews = false

# Its crates.io and Homebrew jobs run in this environment, and crates.io's
# trusted publisher is configured for it (workflow release.yml, environment
# release). forge can't see the crates.io side; set it in the crate's settings.
[tags.rust-release]
environments = ["release"]

# Formula bumps go through the tap GitHub App, never personal access tokens.
# The App only needs to be installed on homebrew-tap.
# `secrets` maps each secret to the local file `forge apply` reads its value
# from when the secret is missing. Values are never compared: GitHub doesn't
# reveal them.
[tags.homebrew]
variables = { TAP_APP_ID = "5098195" }
secrets = { TAP_APP_PRIVATE_KEY = "~/.config/forge/tap-app.pem" }
forbidden_secrets = ["HOMEBREW_TAP_TOKEN", "TAP_GITHUB_TOKEN"]

# winget submissions are PRs to microsoft/winget-pkgs from a fork, which a
# GitHub App can't open, so this is a classic personal access token with
# `public_repo` and `workflow` scopes. When it expires, renew it, save it to
# the file and run `forge apply --update-secrets`. The first version of a
# package has to be submitted with scripts/winget-new.sh.
[tags.winget]
secrets = { WINGET_PAT = "~/.config/forge/winget-pat" }

# Published

[repos.gud]
tags = ["rust"]
rulesets = ["protect-default-branch"]

[repos.tend]
tags = ["rust"]
rulesets = ["require-pr"]

# Its source repo is private, so the archives are published on homebrew-tap's
# typr-dist-vX.Y.Z releases instead.
[repos.typr]
tags = ["rust", "homebrew"]

# Not on the shared workflow, so its archives are listed here. OCaml builds
# Windows binaries with MinGW.
[repos.ocalc]
tags = ["ocaml", "homebrew"]
release_targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-gnu",
]

[repos.folktime]
tags = ["rust"]

[repos.split-paragraphs]
tags = ["rust"]

# Publishes the auburn2d and auburn3d crates with its own workflow.
[repos.auburn]
tags = ["rust"]

[repos.math]
tags = ["rust"]

[repos.acct]
tags = ["rust", "ghcr"]

[repos.finwatch]
tags = ["rust", "ghcr"]

# Infrastructure

# Its releases hold bottles and binaries for other repos.
[repos.homebrew-tap]
releases = false

[repos.forge]
tags = ["rust"]

# Active

[repos.entropy-lab]
tags = ["rust"]

[repos.home-server]
tags = ["rust"]

[repos.sound]
tags = ["rust"]

[repos.magicube-solver]
tags = ["rust"]

[repos.arena-game]
tags = ["rust"]

[repos.nvim]

[repos.cfg]

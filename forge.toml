# Repositories forge manages, and what they should look like.
#
# Top-level `settings`, `actions` and `rulesets` apply to every repo; a repo's
# own table overrides them (`settings`/`actions` key by key, `rulesets` wholesale).
# A repo's `tags` add the requirements listed under `[tags.<name>]`; tags
# without a table are just labels.

owner = "lkurcak"

# The latest GitHub release of every repo must be tagged vX.Y.Z. Repos without
# releases are left alone; older bare X.Y.Z tags only matter while they're the
# latest release.
release_tag_prefix = "v"

# `forge stale` leaves out issues with these labels: feature ideas waiting in
# the backlog aren't stuck, however long they wait.
[stale]
ignore_labels = ["enhancement"]

# Shared workflows, keyed by the file in .github/workflows/ a repo
# calls them from. A repo opts in by making that file a call, and configures
# the workflow through its inputs, e.g. what a release ships:
#
#   jobs:
#     release:
#       uses: lkurcak/forge/.github/workflows/rust-release.yml@v1
#       permissions:
#         contents: write
#         id-token: write
#       secrets: inherit
#       with:
#         crates-io: true
#         binaries: true
#
# forge reads those calls. The repo gets a tag named after each workflow it
# calls (`rust-release`, `rust-ci`), plus a tag per input set to true, so the
# tables below apply to it as if it were tagged in this file. Calls must use
# the ref given here; `v1` moves along with compatible changes.
#
# Releases are then checked to have the archives the workflow builds
# ({repo}-vX.Y.Z-{target}.tar.gz, .zip on Windows; the targets are the release
# workflow's {INPUT}_TARGETS lists), and to have reached the package managers:
# crates.io's newest version, Formula/{repo}.rb in homebrew-tap, and
# {owner}.{repo} in winget-pkgs. A PR still delivering a release shows as
# pending.
[workflows]
"release.yml" = "lkurcak/forge/.github/workflows/rust-release.yml@v1"
"ci.yml" = "lkurcak/forge/.github/workflows/rust-ci.yml@v1"
"pr.yml" = "lkurcak/forge/.github/workflows/pr-title.yml@v1"

# Rulesets are opt-in per repo: `rulesets = [...]` names files in rulesets/,
# without the .json extension.
#   protect-default-branch  no deleting or force-pushing the default branch
#   require-pr              changes to the default branch must go through a PR
#   require-pr-title        the shared PR title check must pass
#   protect-release-tags    no deleting or moving v* tags
# Tags can add rulesets too, with `rulesets = [...]` in their table.
# Private repos are skipped: rulesets there need GitHub Pro.

# PATCH /repos/{owner}/{repo}
# Disabling merge commits and rebase merging is what makes PRs squash-only.
[settings]
allow_squash_merge = true
allow_merge_commit = false
allow_rebase_merge = false
squash_merge_commit_title = "PR_TITLE"
squash_merge_commit_message = "PR_BODY"
delete_branch_on_merge = true
allow_update_branch = true
# Auto-merge stays off; required checks are opt-in per repo.
allow_auto_merge = false
# Docs live in READMEs and work is tracked elsewhere.
has_wiki = false
has_projects = false


# PUT /repos/{owner}/{repo}/actions/permissions
# Only the actions listed in [actions.selected-actions] may run.
[actions]
enabled = true
allowed_actions = "selected"

# PUT /repos/{owner}/{repo}/actions/permissions/workflow
[actions.workflow]
default_workflow_permissions = "read"
# Nothing needs workflows to open PRs yet (release-plz would).
can_approve_pull_request_reviews = false

# PUT /repos/{owner}/{repo}/actions/permissions/selected-actions
# Every action a managed repo uses; a new one has to be added here first.
[actions.selected-actions]
# actions/* and github/*.
github_owned_allowed = true
# Not every Marketplace-verified creator, only the ones listed.
verified_allowed = false
patterns_allowed = [
  # The shared workflows themselves.
  "lkurcak/*",
  "dtolnay/rust-toolchain@*",
  "Swatinem/rust-cache@*",
  "rust-lang/crates-io-auth-action@*",
  "vedantmgoyal9/winget-releaser@*",
  # Container builds.
  "docker/*",
  # ocalc.
  "ocaml/setup-ocaml@*",
  # homebrew-tap.
  "Homebrew/*",
  # home-server's moojctl releases.
  "softprops/action-gh-release@*",
]

# Conventional Commit PR titles become squash commit subjects. Each repo
# commits a pr.yml caller; forge checks it and applies the merge rules.
# Required-check rules are deferred while a required workflow is missing.
[tags.conventional-commits]
calls = ["pr-title"]
rulesets = ["require-pr", "require-pr-title"]

# Lints every package must set in Cargo.toml's [lints], or inherit from
# [workspace.lints] with `lints.workspace = true`, at this level or stricter.
# CI runs clippy with -D warnings, so warn is enough to fail it. forge only
# reports these; the fix is a commit to the repo.
# Rust repos run the shared CI. forge only reports a repo that doesn't call
# it; the fix is a commit to the repo. A repo it doesn't suit declines it with
# the no-rust-ci tag.
[tags.rust]
calls = ["rust-ci"]

[tags.rust.lints.clippy]
# Modules as foo.rs next to foo/, never foo/mod.rs.
mod_module_files = "warn"

# Release tags can't be moved or deleted once pushed, so a published version
# always points at the commit it was built from.
[tags.rust-release]
rulesets = ["protect-release-tags"]

# Secret scanning, and rejecting pushes that contain a secret it recognizes.
# Dependabot opens PRs only for dependencies with known vulnerabilities, not
# for every new version. Only free on public repos, so forge asks each public
# repo to take the tag or decline it with no-security, and flags a private one
# that has it.
[tags.security]
needs_public = true

[tags.security.settings.security_and_analysis]
secret_scanning = { status = "enabled" }
secret_scanning_push_protection = { status = "enabled" }
dependabot_security_updates = { status = "enabled" }

# Its crates.io and Homebrew jobs run in this environment, and crates.io's
# trusted publisher is configured for it (workflow release.yml, environment
# release). forge can't see the crates.io side; set it in the crate's settings.
# Only release tags may deploy to it, so no branch can publish.
[tags.rust-release.environments.release]
deploy_tags = ["v*"]

# Formula bumps go through the tap GitHub App, never personal access tokens.
# The App only needs to be installed on homebrew-tap.
# `secrets` maps each secret to the local file `forge apply` reads its value
# from when the secret is missing. Values are never compared: GitHub doesn't
# reveal them.
[tags.homebrew]
variables = { TAP_APP_ID = "5098195" }
secrets = { TAP_APP_PRIVATE_KEY = "~/.config/forge/tap-app.pem" }
forbidden_secrets = ["HOMEBREW_TAP_TOKEN", "TAP_GITHUB_TOKEN"]

# winget submissions are PRs to microsoft/winget-pkgs from a fork, which a
# GitHub App can't open, so this is a classic personal access token with
# `public_repo` and `workflow` scopes. When it expires, renew it, save it to
# the file and run `forge apply --update-secrets`. The first version of a
# package has to be submitted with scripts/winget-new.sh.
[tags.winget]
secrets = { WINGET_PAT = "~/.config/forge/winget-pat" }

# Published

[repos.gud]
tags = ["rust", "security", "conventional-commits"]
rulesets = ["protect-default-branch"]

[repos.tend]
tags = ["rust", "security", "conventional-commits"]
rulesets = ["require-pr"]

# Private, so its Homebrew formula installs binaries, published on
# homebrew-tap's typr-dist-vX.Y.Z releases.
[repos.typr]
tags = ["rust", "conventional-commits"]

# Not on the shared workflow, so its archives are listed here. OCaml builds
# Windows binaries with MinGW.
[repos.ocalc]
tags = ["ocaml", "homebrew", "security", "conventional-commits"]
rulesets = ["protect-release-tags"]
release_targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-gnu",
]

[repos.folktime]
tags = ["rust", "security", "conventional-commits"]

[repos.split-paragraphs]
tags = ["rust", "security", "conventional-commits"]

[repos.auburn]
tags = ["rust", "security", "conventional-commits"]

[repos.math]
tags = ["rust", "security", "conventional-commits"]

[repos.acct]
tags = ["rust", "conventional-commits"]

[repos.finwatch]
tags = ["rust", "conventional-commits"]

# Infrastructure

# Its releases hold bottles and binaries for other repos.
[repos.homebrew-tap]
tags = ["security", "conventional-commits"]
releases = false

[repos.forge]
tags = ["rust", "security", "conventional-commits"]

# Active

[repos.entropy-lab]
tags = ["rust", "conventional-commits"]

# Compose and config for the home server; its only Rust is the moojctl tool
# in a subdirectory, released by its own workflow under tags naming the tool.
[repos.home-server]
tags = ["conventional-commits"]
release_tag_prefix = "moojctl-v"

[repos.sound]
tags = ["rust", "no-rust-ci", "conventional-commits"]

[repos.magicube-solver]
tags = ["rust", "security", "conventional-commits"]

# A Bevy game on nightly; building it on every push isn't worth the minutes.
[repos.arena-game]
tags = ["rust", "no-rust-ci", "conventional-commits"]

[repos.t-lang]
tags = ["rust", "security", "conventional-commits"]

[repos.nvim]
tags = ["security", "conventional-commits"]

[repos.cfg]
tags = ["security", "conventional-commits"]

[package]
name = "forgectl"
version = "0.2.0"
edition = "2024"
description = "Keep a GitHub account's repositories in line with one manifest"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lkurcak/forge"
readme = "README.md"
keywords = ["github", "repository", "settings", "rulesets", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".claude", ".github/dependabot.yml", ".github/workflows/ci.yml", ".github/workflows/pr.yml", ".github/workflows/release.yml"]

# The crate is forgectl, since forge was taken; the command is still forge.
[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
indicatif = "0.18.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
toml = "1.1.7"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
mod_module_files = "warn"

[package]
name = "forge"
version = "0.1.0"
edition = "2024"
description = "Keep GitHub repositories in line with a manifest"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lkurcak/forge"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.7"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# How a repo calls rust-release.yml, from .github/workflows/release.yml.
# forge checks each caller's triggers against these: a caller may leave some
# out, but add no others ($default-branch stands for the repo's default
# branch). The inputs, which say what a release ships, are described in
# rust-release.yml.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    # Releases a version bump as soon as it lands, by tagging it and
    # starting this workflow on the tag (which needs workflow_dispatch).
    # Without it, pushing a vX.Y.Z tag releases.
    branches: [$default-branch]
  workflow_dispatch:

jobs:
  release:
    uses: lkurcak/forge/.github/workflows/rust-release.yml@v1
    permissions:
      contents: write
      id-token: write
      actions: write
    secrets: inherit
    with:
      crates-io: true
      binaries: true
